name: Auto Label Issues
on:
  issues:
    types:
      - opened
jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # Required to apply labels to the issue
      contents: read  # Required to read the labels.yml file
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Install Dependencies
        run: pip install pyyaml google-genai
      - name: Load Labels Configuration
        id: load_config
        run: |-
          python - <<'EOF'
          import os, yaml, json
          try:
              with open('.github/config/labels.yml', 'r') as f:
                  labels_data = yaml.safe_load(f)
          except Exception as e:
              print(f"Error reading labels.yml: {e}")
              exit(1)
          valid_labels = {item['name']: item['description'] for item in labels_data if item and 'name' in item}
          valid_label_names = list(valid_labels.keys())

          # Output configurations as single-line JSON strings
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"labels_json={json.dumps(valid_labels)}\n")
              f.write(f"label_names={json.dumps(valid_label_names)}\n")
          EOF
      - name: Analyze Issue with Gemini
        id: gemini_analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          VALID_LABELS: ${{ steps.load_config.outputs.labels_json }}
          VALID_LABEL_NAMES: ${{ steps.load_config.outputs.label_names }}
        run: |-
          python - <<'EOF'
          import os, json, random, time, importlib
          from google import genai
          from google.genai import errors, types

          # ======================================================================
          # GEMINI MODELS
          # PRIMARY_MODEL is used first. FALLBACK_MODEL is tried only after all
          # retries against PRIMARY_MODEL have failed with transient errors.
          # ======================================================================
          PRIMARY_MODEL = 'gemini-2.5-flash'
          FALLBACK_MODEL = 'gemini-2.5-flash-lite'

          # Retry settings for transient Gemini failures (overload, rate limiting, timeouts, network errors)
          MAX_ATTEMPTS = 5
          BASE_DELAY_SECONDS = 5  # Delays grow exponentially: ~5s, 10s, 20s, 40s
          REQUEST_TIMEOUT_MS = 60_000
          RETRYABLE_STATUS_CODES = {408, 429, 500, 502, 503, 504}

          # Depending on its version, google-genai uses either httpx or httpx2 as its HTTP client
          TRANSIENT_NETWORK_ERRORS = []
          for module_name in ('httpx', 'httpx2'):
              try:
                  http_module = importlib.import_module(module_name)
              except ImportError:
                  continue
              for error_name in ('TimeoutException', 'NetworkError', 'RemoteProtocolError'):
                  error_class = getattr(http_module, error_name, None)
                  if error_class is not None:
                      TRANSIENT_NETWORK_ERRORS.append(error_class)
          TRANSIENT_NETWORK_ERRORS = tuple(TRANSIENT_NETWORK_ERRORS)

          def is_retryable(e):
              if isinstance(e, errors.APIError):
                  return e.code in RETRYABLE_STATUS_CODES
              return isinstance(e, TRANSIENT_NETWORK_ERRORS)

          class RetriesExhausted(Exception):
              pass

          valid_labels = json.loads(os.environ['VALID_LABELS'])
          valid_label_names = json.loads(os.environ['VALID_LABEL_NAMES'])
          client = genai.Client(
              api_key=os.environ['GEMINI_API_KEY'],
              http_options=types.HttpOptions(timeout=REQUEST_TIMEOUT_MS)
          )
          prompt = f"""
          You are an automated triage assistant for a Godot game engine plugin GitHub repository dealing with Android,
          iOS, and GDScript.
          Your task is to analyze the following GitHub issue and return the most appropriate label names.
          Valid Labels and their descriptions:
          {json.dumps(valid_labels, indent=2)}
          Issue Title: {os.environ.get('ISSUE_TITLE', '')}
          Issue Body:
          {os.environ.get('ISSUE_BODY', '')}
          """
          def generate_with_retries(model):
              """Returns the response; raises RetriesExhausted after repeated transient errors.
              Exits the run on non-retryable errors."""
              print(f"Sending prompt to Gemini model {model}...")
              for attempt in range(1, MAX_ATTEMPTS + 1):
                  try:
                      return client.models.generate_content(
                          model=model,
                          contents=prompt,
                          config=types.GenerateContentConfig(
                              response_mime_type="application/json",
                              response_schema={
                                  "type": "ARRAY",
                                  "items": {
                                      "type": "STRING",
                                      "enum": valid_label_names
                                  }
                              }
                          )
                      )
                  except Exception as e:
                      if not is_retryable(e):
                          print(f"Non-retryable error during Gemini request to {model}: {e}")
                          exit(1)
                      if attempt == MAX_ATTEMPTS:
                          raise RetriesExhausted(f"{model} failed after {MAX_ATTEMPTS} attempts: {e}") from e
                      delay = BASE_DELAY_SECONDS * 2 ** (attempt - 1) + random.uniform(0, 1)
                      print(f"Transient error from {model} on attempt {attempt}/{MAX_ATTEMPTS}: {e}")
                      print(f"Retrying in {delay:.1f} seconds...")
                      time.sleep(delay)

          try:
              response = generate_with_retries(PRIMARY_MODEL)
          except RetriesExhausted as primary_error:
              print(f"{primary_error}")
              print(f"Falling back to Gemini model {FALLBACK_MODEL}...")
              try:
                  response = generate_with_retries(FALLBACK_MODEL)
              except RetriesExhausted as fallback_error:
                  print(f"{fallback_error}")
                  print("::warning title=Gemini unavailable::Issue was left unlabeled because both "
                        f"{PRIMARY_MODEL} and {FALLBACK_MODEL} failed with transient errors. "
                        "Please label it manually.")
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write("labels=\n")
                  exit(0)
          try:
              selected_labels = json.loads(response.text.strip())
          except Exception as e:
              print(f"Error during Gemini processing: {e}")
              exit(1)
          if not selected_labels:
              print("Gemini determined no labels are applicable.")
              labels_str = ""
          else:
              print(f"Gemini selected labels: {selected_labels}")
              labels_str = ",".join(selected_labels)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"labels={labels_str}\n")
          EOF
      - name: Apply Labels to Issue
        if: ${{ steps.gemini_analysis.outputs.labels != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          gh issue edit ${{ github.event.issue.number }} --add-label "${{ steps.gemini_analysis.outputs.labels }}"
